name: PR checks

on:
    pull_request:
    push:
        branches: ["master"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: src/executable/go.mod
                  cache-dependency-path: src/executable/go.sum

            - name: Install dependencies
              run: npm ci

            - name: Test types and build
              run: npm run build

            - name: Build the standalone executables
              run: npm run build:binary
