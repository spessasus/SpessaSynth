version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 5
    - package-ecosystem: "gomod"
      directory: "/src/executable"
      schedule:
          interval: "monthly"
